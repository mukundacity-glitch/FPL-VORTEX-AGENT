name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install core dependencies
        run: npm install

      - name: Typecheck core
        run: npm run typecheck

      - name: Build core
        run: npm run build

      - name: Test core
        run: npm test

      - name: Install Vortex web dependencies
        run: npm run web:install

      - name: Typecheck Vortex web
        run: npm run web:typecheck

      - name: Build Vortex web
        run: npm run web:build
